name: hamsa-sim-generation

on:
  push:
    branches: [feature/hamsa-dual-issue]
  pull_request:
    branches: [CV32e40p-original, master]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate HAMSA simulation files
        run: |
          python3 util/gen_hamsa_sim.py
          test -s rtl/cv32e40p_core_hamsa.sv
          test -s rtl/cv32e40p_wrapper_hamsa.sv
          test -s example_tb/core/cv32e40p_tb_subsystem_hamsa.sv
          test -s example_tb/core/tb_top_hamsa.sv
          test -s cv32e40p_manifest_hamsa.flist
      - name: Check generated module wiring
        run: |
          grep -q 'module cv32e40p_core_hamsa' rtl/cv32e40p_core_hamsa.sv
          grep -q 'module cv32e40p_wrapper_hamsa' rtl/cv32e40p_wrapper_hamsa.sv
          grep -q 'cv32e40p_core_hamsa' rtl/cv32e40p_wrapper_hamsa.sv
          grep -q 'module cv32e40p_tb_subsystem_hamsa' example_tb/core/cv32e40p_tb_subsystem_hamsa.sv
          grep -q 'module tb_top_hamsa' example_tb/core/tb_top_hamsa.sv
          grep -q 'HAMSA_METRIC cycles=' example_tb/core/tb_top_hamsa.sv
          grep -q 'cv32e40p_core_hamsa.sv' cv32e40p_manifest_hamsa.flist
          grep -q 'cv32e40p_wrapper_hamsa.sv' cv32e40p_manifest_hamsa.flist
      - name: Python syntax checks
        run: |
          python3 -m py_compile util/gen_hamsa_core.py util/gen_hamsa_sim.py \
            evaluation/run_example_vsim.py evaluation/run_benchmark_matrix.py \
            evaluation/parse_hamsa_log.py evaluation/compute_metrics.py
